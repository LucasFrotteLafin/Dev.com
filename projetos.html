<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dev.com — Projetos</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .page-header { padding: 32px; background-color: white; border-bottom: 1px solid #ddd; text-align: center; }
    .page-header h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .page-header p { color: #777; font-size: 0.9rem; }
    .search-bar { padding: 24px 32px; background-color: #f4f4f4; border-bottom: 1px solid #ddd; text-align: center; }
    .search-bar input { width: 100%; max-width: 500px; padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; outline: none; }
    .search-bar input:focus { border-color: #6c63ff; }
    .projects-list { padding: 24px 32px; max-width: 860px; margin: 0 auto; }
    .results-count { font-size: 0.85rem; color: #777; margin-bottom: 16px; }
    .project-card { background-color: white; border: 1px solid #ddd; border-radius: 8px; padding: 20px 24px; margin-bottom: 16px; cursor: pointer; }
    .project-card:hover { border-color: #6c63ff; }
    .project-card h3 { font-size: 1rem; margin-bottom: 6px; }
    .project-card p { font-size: 0.85rem; color: #777; line-height: 1.5; margin-bottom: 12px; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
    .budget { font-weight: bold; color: #2e7d52; }
    .card-meta { font-size: 0.78rem; color: #999; display: flex; gap: 14px; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .no-results { text-align: center; color: #999; padding: 60px 0; }
  </style>
</head>
<body>

  <nav>
    <div class="logo">Dev.com</div>
    <ul>
      <li><a href="index.html">Início</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
    </ul>
    <button class="nav-btn" id="nav-user-btn"></button>
  </nav>

  <div class="page-header">
    <h1>Projetos disponíveis</h1>
    <p>Encontre projetos em aberto que combinam com suas habilidades</p>
  </div>

  <div class="search-bar">
    <input type="text" id="search" placeholder="Buscar projetos..." oninput="renderList()" />
  </div>

  <div class="projects-list">
    <p class="results-count" id="results-count"></p>
    <div id="list"></div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script>
    Store.seed();

    const navBtn = document.getElementById("nav-user-btn");
    const session = Auth.getSession();
    if (session) {
      navBtn.textContent = session.name.split(" ")[0];
      navBtn.onclick = () => { window.location.href = "dashboard.html"; };
    } else {
      navBtn.textContent = "Entrar";
      navBtn.onclick = () => { window.location.href = "auth.html"; };
    }

    function renderList() {
      const search = document.getElementById("search").value.toLowerCase();
      // Only open projects
      const list = Store.getProjects().filter(p =>
        p.status === "open" &&
        (!search || p.title.toLowerCase().includes(search) || p.description.toLowerCase().includes(search))
      );

      document.getElementById("results-count").textContent = list.length + " projeto(s) em aberto";

      if (list.length === 0) {
        document.getElementById("list").innerHTML = `<div class="no-results">🔍 Nenhum projeto em aberto encontrado.</div>`;
        return;
      }

      document.getElementById("list").innerHTML = list.map(p => `
        <div class="project-card" onclick="goTo('projeto-detalhes.html', ${p.id})">
          <span class="badge badge-green">Aberto</span>
          <h3 style="margin-top:8px">${p.title}</h3>
          <p>${p.description}</p>
          <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
          <div class="card-footer">
            <span class="budget">${p.budget}</span>
            <div class="card-meta">
              <span>⏱ ${p.deadline}</span>
              <span>📨 ${p.proposals || 0} propostas</span>
              <span>👤 ${p.client}</span>
            </div>
          </div>
        </div>
      `).join("");
    }

    renderList();
  </script>

</body>
</html>
