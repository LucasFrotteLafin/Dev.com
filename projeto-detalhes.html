<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dev.com — Detalhes do Projeto</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .back-bar {
      padding: 16px 32px;
      background-color: white;
      border-bottom: 1px solid #ddd;
    }

    .back-bar button {
      background: none;
      border: none;
      color: #6c63ff;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .back-bar button:hover {
      text-decoration: underline;
    }

    .detail-layout {
      display: flex;
      gap: 32px;
      padding: 32px;
      align-items: flex-start;
    }

    .detail-main {
      flex: 1;
    }

    .detail-main h1 {
      font-size: 1.5rem;
      margin: 12px 0 8px;
    }

    .detail-meta {
      display: flex;
      gap: 20px;
      font-size: 0.85rem;
      color: #777;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .detail-section {
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .detail-section h2 {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .detail-section p {
      font-size: 0.88rem;
      color: #555;
      line-height: 1.7;
    }

    .requirements {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .requirements li {
      font-size: 0.88rem;
      color: #555;
    }

    .requirements li::before {
      content: "✓ ";
      color: #2e7d52;
      font-weight: bold;
    }

    .tags { display: flex; gap: 6px; flex-wrap: wrap; }

    .proposal-item {
      display: flex;
      gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid #eee;
    }

    .proposal-item:last-child {
      border-bottom: none;
    }

    .proposal-info { flex: 1; }

    .proposal-info h4 {
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .proposal-info p {
      font-size: 0.82rem;
      color: #777;
      line-height: 1.5;
    }

    .proposal-right {
      text-align: right;
      flex-shrink: 0;
    }

    .proposal-right strong {
      display: block;
      color: #2e7d52;
      font-size: 0.95rem;
    }

    .proposal-right span {
      font-size: 0.78rem;
      color: #999;
    }

    /* SIDEBAR */
    .detail-sidebar {
      width: 280px;
      flex-shrink: 0;
    }

    .sidebar-box {
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .sidebar-box h3 {
      font-size: 0.8rem;
      font-weight: bold;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .info-line {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .info-line:last-child { border-bottom: none; }
    .info-line span:first-child { color: #777; }
    .info-line span:last-child { font-weight: bold; }

    .apply-btn {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
    }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background-color: white;
      border-radius: 10px;
      padding: 32px;
      width: 100%;
      max-width: 460px;
    }

    .modal h2 {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: #777;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      font-family: Arial, sans-serif;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #6c63ff;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 90px;
    }

    .modal-btns {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .dev-avatar {
      width: 36px;
      height: 36px;
      background-color: #6c63ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 0.78rem;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">Dev.com</div>
    <ul>
      <li><a href="index.html">Início</a></li>
      <li><a href="projetos.html">Projetos</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
    </ul>
    <button class="nav-btn" onclick="goTo('dashboard.html')">Entrar</button>
  </nav>

  <div class="back-bar">
    <button onclick="history.back()">← Voltar para projetos</button>
  </div>

  <div class="detail-layout" id="page-content">
    <p style="color:#777">Carregando...</p>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h2>Enviar proposta</h2>
      <div class="form-group">
        <label>Seu valor (R$)</label>
        <input type="number" id="prop-value" placeholder="Ex: 2500" />
      </div>
      <div class="form-group">
        <label>Prazo estimado</label>
        <input type="text" id="prop-deadline" placeholder="Ex: 20 dias" />
      </div>
      <div class="form-group">
        <label>Mensagem para o cliente</label>
        <textarea id="prop-msg" placeholder="Descreva sua experiência..."></textarea>
      </div>
      <div class="modal-btns">
        <button class="btn btn-purple" style="flex:1" onclick="submitProposal()">Enviar</button>
        <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    const proposals = [
      { name: "João Souza", avatar: "JS", rating: "4.9", value: "R$ 3.200", deadline: "28 dias", msg: "Tenho experiência com projetos similares e posso iniciar imediatamente." },
      { name: "Maria Lima", avatar: "ML", rating: "4.7", value: "R$ 3.800", deadline: "25 dias", msg: "Já entreguei mais de 10 projetos do mesmo tipo com ótimo resultado." },
    ];

    const requirements = [
      "Design responsivo para mobile e desktop",
      "Integração com sistema de pagamentos",
      "Painel administrativo completo",
      "Código limpo e documentado",
      "Entrega com testes funcionais",
    ];

    const id = parseInt(new URLSearchParams(window.location.search).get("id")) || 1;
    const project = mockProjects.find(p => p.id === id) || mockProjects[0];

    document.title = "Dev.com — " + project.title;

    document.getElementById("page-content").innerHTML = `
      <div class="detail-main">
        <div>
          <span class="badge ${getStatusBadge(project.status)}">${getStatusLabel(project.status)}</span>
          <span class="tag" style="margin-left:8px">${project.category}</span>
        </div>
        <h1>${project.title}</h1>
        <div class="detail-meta">
          <span>👤 ${project.client}</span>
          <span>🕐 Publicado ${project.createdAt}</span>
          <span>📨 ${project.proposals} proposta(s)</span>
        </div>

        <div class="detail-section">
          <h2>Descrição</h2>
          <p>${project.description} A solução deve ser escalável e seguir boas práticas de desenvolvimento.</p>
        </div>

        <div class="detail-section">
          <h2>Requisitos</h2>
          <ul class="requirements">
            ${requirements.map(r => `<li>${r}</li>`).join("")}
          </ul>
        </div>

        <div class="detail-section">
          <h2>Tecnologias desejadas</h2>
          <div class="tags">
            ${project.tags.map(t => `<span class="tag">${t}</span>`).join("")}
          </div>
        </div>

        <div class="detail-section">
          <h2>Propostas recebidas (${proposals.length})</h2>
          ${proposals.map(p => `
            <div class="proposal-item">
              <div class="dev-avatar">${p.avatar}</div>
              <div class="proposal-info">
                <h4>${p.name} <span style="color:#f0a500; font-size:0.78rem">★ ${p.rating}</span></h4>
                <p>${p.msg}</p>
              </div>
              <div class="proposal-right">
                <strong>${p.value}</strong>
                <span>⏱ ${p.deadline}</span>
              </div>
            </div>
          `).join("")}
        </div>
      </div>

      <div class="detail-sidebar">
        <div class="sidebar-box">
          <h3>Informações</h3>
          <div class="info-line"><span>Orçamento</span><span style="color:#2e7d52">${project.budget}</span></div>
          <div class="info-line"><span>Prazo</span><span>${project.deadline}</span></div>
          <div class="info-line"><span>Categoria</span><span>${project.category}</span></div>
          <div class="info-line"><span>Propostas</span><span>${project.proposals}</span></div>
        </div>

        <div class="sidebar-box">
          <h3>Cliente</h3>
          <p style="font-size:0.9rem; font-weight:bold">${project.client}</p>
          <p style="font-size:0.8rem; color:#f0a500; margin-top:4px">★★★★★ 5.0</p>
        </div>

        ${project.status === "open"
          ? `<button class="btn btn-purple apply-btn" onclick="openModal()">Enviar proposta</button>`
          : `<button class="btn apply-btn" style="background:#eee; color:#999; cursor:not-allowed" disabled>Projeto encerrado</button>`
        }

        <button class="btn btn-outline apply-btn" style="margin-top:10px" onclick="goTo('projetos.html')">Ver mais projetos</button>
      </div>
    `;

    function openModal() { document.getElementById("modal").classList.add("open"); }
    function closeModal() { document.getElementById("modal").classList.remove("open"); }

    function submitProposal() {
      const v = document.getElementById("prop-value").value;
      const d = document.getElementById("prop-deadline").value;
      const m = document.getElementById("prop-msg").value;
      if (!v || !d || !m) { alert("Preencha todos os campos."); return; }
      closeModal();
      alert("✅ Proposta enviada com sucesso!");
    }

    document.getElementById("modal").addEventListener("click", function(e) {
      if (e.target === this) closeModal();
    });
  </script>

</body>
</html>
