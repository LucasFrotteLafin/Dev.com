<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dev.com — Perfil do Desenvolvedor</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .back-bar { padding: 16px 32px; background: white; border-bottom: 1px solid #ddd; }
    .back-bar button { background: none; border: none; color: #6c63ff; cursor: pointer; font-size: .9rem; }
    .back-bar button:hover { text-decoration: underline; }
    .profile-hero { background: #6c63ff; color: white; padding: 48px 32px 36px; display: flex; align-items: center; gap: 28px; }
    .profile-avatar { width: 88px; height: 88px; background: white; color: #6c63ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: bold; flex-shrink: 0; }
    .profile-hero h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .profile-hero p  { opacity: .88; font-size: .9rem; margin-bottom: 10px; }
    .stars-row { display: flex; align-items: center; gap: 6px; font-size: .9rem; }
    .stars { color: #f0a500; letter-spacing: 2px; }
    .profile-stats { display: flex; background: white; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
    .profile-stat { flex: 1; text-align: center; padding: 20px; border-right: 1px solid #ddd; min-width: 120px; }
    .profile-stat:last-child { border-right: none; }
    .profile-stat strong { display: block; font-size: 1.5rem; color: #6c63ff; }
    .profile-stat span { font-size: .8rem; color: #777; }
    .profile-body { max-width: 760px; margin: 0 auto; padding: 32px; }
    .card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
    .card h2 { font-size: 1rem; font-weight: bold; margin-bottom: 14px; color: #333; }
    .card p  { font-size: .88rem; color: #555; line-height: 1.7; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .feedback-item { padding: 14px 0; border-bottom: 1px solid #eee; }
    .feedback-item:last-child { border-bottom: none; }
    .feedback-stars { color: #f0a500; font-size: .88rem; margin-bottom: 4px; }
    .feedback-item p    { font-size: .85rem; color: #555; margin-bottom: 4px; }
    .feedback-item span { font-size: .78rem; color: #999; }
    .past-project { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
    .past-project:last-child { border-bottom: none; }
    .past-project h4   { font-size: .9rem; margin-bottom: 6px; }
    .past-project span { font-size: .78rem; color: #999; }
    .not-found { text-align: center; padding: 80px 32px; color: #999; }
  </style>
</head>
<body>
  <nav>
    <div class="logo">Dev.com</div>
    <ul>
      <li><a href="index.html">Início</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
    </ul>
    <button class="nav-btn" id="nav-user-btn"></button>
  </nav>

  <div class="back-bar">
    <button onclick="history.back()">← Voltar</button>
  </div>

  <div id="page-content"><p style="padding:48px;text-align:center;color:#999">Carregando...</p></div>

  <script src="js/main.js"></script>
  <script>
    renderNav();

    function renderStars(rating) {
      const full = Math.floor(rating);
      const half = rating % 1 >= 0.5;
      return "★".repeat(full) + (half ? "½" : "") + "☆".repeat(5 - full - (half ? 1 : 0));
    }

    const email = new URLSearchParams(window.location.search).get("dev");

    (async () => {
      if (!email) {
        document.getElementById("page-content").innerHTML = `<div class="not-found">Perfil não encontrado.</div>`;
        return;
      }
      try {
        const p = await api(`/api/devs/${encodeURIComponent(email)}`);
        document.title = "Dev.com — " + p.name;

        document.getElementById("page-content").innerHTML = `
          <div class="profile-hero">
            <div class="profile-avatar">${p.name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase()}</div>
            <div>
              <h1>${p.name}</h1>
              <p>${p.bio || "Sem bio."}</p>
              <div class="stars-row">
                <span class="stars">${renderStars(p.rating)}</span>
                <span>${p.rating.toFixed(1)} · membro desde ${new Date(p.memberSince).getFullYear()}</span>
              </div>
            </div>
          </div>

          <div class="profile-stats">
            <div class="profile-stat"><strong>${p.completedCount}</strong><span>Projetos concluídos</span></div>
            <div class="profile-stat"><strong>${p.rating.toFixed(1)} ★</strong><span>Avaliação média</span></div>
            <div class="profile-stat"><strong>${p.feedbacks.length}</strong><span>Avaliações recebidas</span></div>
          </div>

          <div class="profile-body">
            ${p.skills.length ? `
            <div class="card">
              <h2>Habilidades</h2>
              <div class="tags">${p.skills.map(s => `<span class="tag">${s}</span>`).join("")}</div>
            </div>` : ""}

            ${p.pastProjects.length ? `
            <div class="card">
              <h2>Projetos concluídos anteriormente</h2>
              ${p.pastProjects.map(pp => `
                <div class="past-project">
                  <div>
                    <h4>${pp.title}</h4>
                    <div class="tags" style="margin-top:4px">${pp.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
                  </div>
                  <span>⏱ ${pp.duration}</span>
                </div>`).join("")}
            </div>` : ""}

            ${p.feedbacks.length ? `
            <div class="card">
              <h2>Avaliações de empresas</h2>
              ${p.feedbacks.map(f => `
                <div class="feedback-item">
                  <div class="feedback-stars">${"★".repeat(f.stars)}${"☆".repeat(5-f.stars)} ${f.stars}.0</div>
                  <p>"${f.text}"</p>
                  <span>${f.company}</span>
                </div>`).join("")}
            </div>` : ""}
          </div>`;
      } catch {
        document.getElementById("page-content").innerHTML = `<div class="not-found">Perfil não encontrado.</div>`;
      }
    })();
  </script>
</body>
</html>
